# =============================================================================
# CEC controller — ESP32-S3
# Makes the HDMI-CEC devices on the bus controllable from Home Assistant.
#
# Uses the custom `hdmi_cec_rmt` component: RMT generates the TX waveforms,
# a GPIO edge ISR decodes RX and drives the ACK bit, a GPTimer ends the ACK.
#
# Deliberately NOT enabled: bluetooth_proxy / esp32_ble_tracker. Radio load
# adds interrupt latency, and CEC ACK has a ~300 µs budget.
# =============================================================================

substitutions:
  name: cec-controller
  friendly_name: CEC Controller
  cec_pin: GPIO17               # Open-drain; HDMI pin 13 (CEC), GND to HDMI pin 17

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf               # Needed for the new RMT driver, IRAM ISR and GPTimer

external_components:
  - source: github://TjepkemaTechniek/esphome-cec-rmt@main
    components: [hdmi_cec_rmt]
    refresh: 0s                 # Always pull the latest commit while developing

logger:
  level: DEBUG
  logs:
    hdmi_cec_rmt: DEBUG         # Every frame on the bus, decoded, plus ACK/NACK

api:
  encryption:
    key: !secret cec_api_key
  # Raw actions so anything can be scripted from Home Assistant
  actions:
    - action: cec_send
      variables:
        destination: int
        data: int[]
      then:
        - hdmi_cec_rmt.send:
            destination: !lambda "return destination;"
            data: !lambda |-
              std::vector<uint8_t> out;
              for (auto b : data) out.push_back(static_cast<uint8_t>(b));
              return out;
    - action: cec_power_on
      variables:
        logical_address: int
      then:
        - hdmi_cec_rmt.power_on:
            destination: !lambda "return logical_address;"
    - action: cec_standby
      variables:
        logical_address: int    # 15 = everything
      then:
        - hdmi_cec_rmt.standby:
            destination: !lambda "return logical_address;"
    - action: cec_set_source
      variables:
        logical_address: int
      then:
        - hdmi_cec_rmt.set_active_source:
            destination: !lambda "return logical_address;"
    - action: cec_key
      variables:
        logical_address: int
        key: int                # CEC UI command code, e.g. 0x44 = play, 0x41 = vol up
      then:
        - hdmi_cec_rmt.user_control:
            destination: !lambda "return logical_address;"
            key: !lambda "return key;"
    - action: cec_scan
      then:
        - hdmi_cec_rmt.scan:

ota:
  - platform: esphome
    password: !secret cec_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "CEC-Controller Fallback"

captive_portal:

# -----------------------------------------------------------------------------
# CEC bus
# -----------------------------------------------------------------------------
hdmi_cec_rmt:
  id: cec
  pin: ${cec_pin}
  # 14 = "Specific Use": a controller that doesn't show up as an input.
  # If your TV ignores address 14, switch to a free playback address (8 or 11).
  logical_address: 14
  # Not on a real HDMI port, so claim an unused port number to look sane.
  # Set this to a port with nothing plugged in (0x3000 = HDMI 3).
  physical_address: 0x3000
  osd_name: "Home Assistant"
  scan_interval: 5min           # Full poll of addresses 0-14; also on boot and on demand
  promiscuous: true             # Decode and report ALL traffic, but only ACK our own address

  # Devices you want entities for. Discovery fills in name/vendor/physical address
  # and power at runtime. Anything else that shows up is reported as an event.
  # Fill this in from the first scan (task list step 6).
  devices:
    - id: tv
      logical_address: 0
      name: TV
    - id: player
      logical_address: 4
      name: Media player
    - id: audio_system
      logical_address: 5
      name: Audio system

  # Every received frame becomes a Home Assistant event, for automations.
  # Requires "Allow the device to perform Home Assistant actions" (task list step 7).
  on_message:
    - then:
        - homeassistant.event:
            event: esphome.hdmi_cec_message
            data:
              source: !lambda "return to_string(source);"
              destination: !lambda "return to_string(destination);"
              opcode: !lambda "return data.empty() ? std::string(\"poll\") : format_hex(data[0]);"
              data: !lambda "return format_hex_pretty(data, ':', false);"

  # A device we don't have in `devices:` answered a poll
  on_device_discovered:
    - then:
        - logger.log:
            format: "New CEC device: LA %d, PA %04X, name '%s'"
            args: [logical_address, physical_address, osd_name.c_str()]
        - homeassistant.event:
            event: esphome.hdmi_cec_device_discovered
            data:
              logical_address: !lambda "return to_string(logical_address);"
              physical_address: !lambda "return format_hex(physical_address);"
              osd_name: !lambda "return osd_name;"

# -----------------------------------------------------------------------------
# Per-device entities
# -----------------------------------------------------------------------------
switch:
  # ON = power on (Image View On for the TV, Power On key for others)
  # OFF = <Standby>. State comes from <Report Power Status>.
  - platform: hdmi_cec_rmt
    device: tv
    name: TV power
  - platform: hdmi_cec_rmt
    device: player
    name: Media player power
  - platform: hdmi_cec_rmt
    device: audio_system
    name: Audio system power

binary_sensor:
  - platform: hdmi_cec_rmt
    device: tv
    present:
      name: TV connected
  - platform: hdmi_cec_rmt
    device: player
    present:
      name: Media player connected
  - platform: hdmi_cec_rmt
    device: audio_system
    present:
      name: Audio system connected

text_sensor:
  - platform: hdmi_cec_rmt
    device: player
    osd_name:
      name: Media player CEC name
    physical_address:
      name: Media player HDMI address
      entity_category: diagnostic
    vendor_id:
      name: Media player vendor
      entity_category: diagnostic
  - platform: hdmi_cec_rmt
    device: audio_system
    osd_name:
      name: Audio system CEC name
    physical_address:
      name: Audio system HDMI address
      entity_category: diagnostic
  # Bus-wide
  - platform: hdmi_cec_rmt
    active_source:
      name: Active source         # OSD name, or "HDMI x.x.x.x" if unknown
    last_message:
      name: CEC last message
      entity_category: diagnostic
      disabled_by_default: true   # Very chatty; enable while debugging

select:
  # Options are the device names below; selecting one switches the TV to it
  # (<Set Stream Path> + <Active Source> fallback). Follows the bus when the
  # active source changes by other means.
  - platform: hdmi_cec_rmt
    name: HDMI source
    devices: [tv, player]

sensor:
  # Diagnostics for the transport. tx_nack and rx_ack_missed are the numbers
  # that tell us whether the ACK path is working.
  - platform: hdmi_cec_rmt
    frames_received:
      name: CEC frames received
    frames_sent:
      name: CEC frames sent
    tx_nack:
      name: CEC TX not acknowledged
    rx_ack_missed:
      name: CEC ACKs missed
    rx_errors:
      name: CEC RX errors
    acks_sent:
      name: CEC ACKs sent
    tx_arbitration_lost:
      name: CEC TX arbitration lost
    update_interval: 60s
  - platform: wifi_signal
    name: WiFi signal
    update_interval: 60s
  - platform: uptime
    name: Uptime

# -----------------------------------------------------------------------------
# Convenience buttons
# -----------------------------------------------------------------------------
button:
  - platform: template
    name: Scan CEC bus
    entity_category: config
    on_press:
      - hdmi_cec_rmt.scan:

  - platform: template
    name: Everything off
    icon: mdi:power-standby
    on_press:
      - hdmi_cec_rmt.standby:
          destination: 15        # Broadcast

  # Volume via CEC goes to the audio system (address 5). Only does something
  # when an ARC amp/soundbar is on the bus; most TVs ignore volume keys for
  # their own speakers.
  - platform: template
    name: Volume up
    icon: mdi:volume-plus
    on_press:
      - hdmi_cec_rmt.user_control:
          destination: 5
          key: 0x41
  - platform: template
    name: Volume down
    icon: mdi:volume-minus
    on_press:
      - hdmi_cec_rmt.user_control:
          destination: 5
          key: 0x42
  - platform: template
    name: Mute
    icon: mdi:volume-mute
    on_press:
      - hdmi_cec_rmt.user_control:
          destination: 5
          key: 0x43

  # Remote keys to the Media player
  - platform: template
    name: Player play-pause
    icon: mdi:play-pause
    on_press:
      - hdmi_cec_rmt.user_control:
          destination: 4
          key: 0x44              # Play (many players toggle)
  - platform: template
    name: Player menu
    icon: mdi:menu
    on_press:
      - hdmi_cec_rmt.user_control:
          destination: 4
          key: 0x0D              # Exit/back
