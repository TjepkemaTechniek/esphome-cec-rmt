# =============================================================================
# CEC controller — ESP32-S3
# Makes the HDMI-CEC devices on the bus controllable from Home Assistant.
#
# Uses the custom `hdmi_cec_rmt` component: RMT generates the TX waveforms,
# a GPIO edge ISR decodes RX and drives the ACK bit, a GPTimer ends the ACK.
#
# Deliberately NOT enabled: bluetooth_proxy / esp32_ble_tracker. Radio load
# adds interrupt latency, and CEC ACK has a ~300 µs budget.
# =============================================================================

substitutions:
  name: cec-controller
  friendly_name: CEC Controller
  cec_pin: GPIO17               # Open-drain; HDMI pin 13 (CEC), GND to HDMI pin 17

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf               # Needed for the new RMT driver, IRAM ISR and GPTimer

external_components:
  - source: github://TjepkemaTechniek/esphome-cec-rmt@main
    components: [hdmi_cec_rmt]
    refresh: 0s                 # Always pull the latest commit while developing

logger:
  level: DEBUG
  logs:
    hdmi_cec_rmt: DEBUG         # Every frame on the bus, decoded, plus ACK/NACK

api:
  encryption:
    key: !secret cec_api_key
  actions:
    # The easy one: a command by name to a device by name, e.g.
    #   action: esphome.cec_controller_cec_command
    #   data: {device: "Apple TV", command: "play"}
    # device: a name from `devices:` below, the device's own CEC name, "TV", "all", or 0-15.
    # command: on, standby, switch_to, power_status, or a key: play, pause, stop, select,
    #   up, down, left, right, back, home, volume_up, volume_down, mute, fast_forward, ...
    - action: cec_command
      variables:
        device: string
        command: string
      then:
        - hdmi_cec_rmt.command:
            device: !lambda "return device;"
            command: !lambda "return command;"
    # Raw actions so anything else can be scripted from Home Assistant
    - action: cec_send
      variables:
        destination: int
        data: int[]
      then:
        - hdmi_cec_rmt.send:
            destination: !lambda "return destination;"
            data: !lambda |-
              std::vector<uint8_t> out;
              for (auto b : data) out.push_back(static_cast<uint8_t>(b));
              return out;
    - action: cec_power_on
      variables:
        logical_address: int
      then:
        - hdmi_cec_rmt.power_on:
            destination: !lambda "return logical_address;"
    - action: cec_standby
      variables:
        logical_address: int    # 15 = everything
      then:
        - hdmi_cec_rmt.standby:
            destination: !lambda "return logical_address;"
    - action: cec_set_source
      variables:
        logical_address: int
      then:
        - hdmi_cec_rmt.set_active_source:
            destination: !lambda "return logical_address;"
    - action: cec_key
      variables:
        logical_address: int
        key: int                # CEC UI command code, e.g. 0x44 = play, 0x41 = vol up
      then:
        - hdmi_cec_rmt.user_control:
            destination: !lambda "return logical_address;"
            key: !lambda "return key;"
    - action: cec_scan
      then:
        - hdmi_cec_rmt.scan:

ota:
  - platform: esphome
    password: !secret cec_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "CEC-Controller Fallback"

captive_portal:

# -----------------------------------------------------------------------------
# CEC bus
# -----------------------------------------------------------------------------
hdmi_cec_rmt:
  id: cec
  pin: ${cec_pin}
  # Passive (the default): never polls the bus. Devices, names, power and the active source
  # are learned from the traffic between the TV and the other devices; we ACK and answer what
  # is sent to us, and only transmit for commands you give. Set to false to poll as before.
  passive: true
  # 14 = "Specific Use": a controller that doesn't show up as an input.
  # If your TV ignores address 14, switch to a free playback address (8 or 11).
  logical_address: 14
  # Not on a real HDMI port, so claim an unused port number to look sane.
  # Set this to a port with nothing plugged in (0x3000 = HDMI 3).
  physical_address: 0x3000
  osd_name: "Home Assistant"
  # scan_interval: 5min         # Off in passive mode; the "Scan CEC bus" button still works
  promiscuous: true             # Decode and report ALL traffic, but only ACK our own address

  # Devices you want entities for. Give a fixed logical_address, or leave it out and let the
  # device be found by what it says about itself (vendor_id, osd_name, device_type): a playback
  # device can end up at 4, 8 or 11 depending on what else is connected. The address it was
  # last found at is remembered, so commands work right after a reboot.
  # Anything else that shows up is reported with on_device_discovered.
  devices:
    - id: tv
      logical_address: 0
      name: TV
    - id: apple_tv
      name: Apple TV
      vendor_id: 0x0010FA        # Apple
      osd_name: Apple TV
    - id: audio_system
      logical_address: 5
      name: Audio system

  # Every received frame becomes a Home Assistant event, for automations. Trigger on e.g.
  #   event_type: esphome.hdmi_cec_message
  #   event_data: {source_name: "Apple TV", command: "Active Source"}
  # or a remote key sent to the Apple TV: {destination_name: "Apple TV", key: "play"}.
  # Requires "Allow the device to perform Home Assistant actions" in the ESPHome integration.
  on_message:
    - then:
        - homeassistant.event:
            event: esphome.hdmi_cec_message
            data:
              source: !lambda "return to_string(source);"
              destination: !lambda "return to_string(destination);"
              source_name: !lambda "return id(cec).display_name(source);"
              destination_name: !lambda "return destination == 15 ? std::string(\"all\") : id(cec).display_name(destination);"
              command: !lambda "return data.empty() ? std::string(\"Poll\") : std::string(hdmi_cec_rmt::opcode_name(data[0]));"
              key: !lambda "return data.size() >= 2 && data[0] == 0x44 ? std::string(hdmi_cec_rmt::key_name(data[1])) : std::string();"
              data: !lambda "return format_hex_pretty(data, ':', false);"

  # A device we don't have in `devices:` answered a poll
  on_device_discovered:
    - then:
        - logger.log:
            format: "New CEC device: LA %d, PA %04X, name '%s'"
            args: [logical_address, physical_address, osd_name.c_str()]
        - homeassistant.event:
            event: esphome.hdmi_cec_device_discovered
            data:
              logical_address: !lambda "return to_string(logical_address);"
              physical_address: !lambda "return format_hex(physical_address);"
              osd_name: !lambda "return osd_name;"

# -----------------------------------------------------------------------------
# Per-device entities
# -----------------------------------------------------------------------------
switch:
  # ON = power on (Image View On for the TV, Power On key for others)
  # OFF = <Standby>. State comes from <Report Power Status>.
  - platform: hdmi_cec_rmt
    device: tv
    name: TV power
  - platform: hdmi_cec_rmt
    device: apple_tv
    name: Apple TV power
  - platform: hdmi_cec_rmt
    device: audio_system
    name: Audio system power

binary_sensor:
  - platform: hdmi_cec_rmt
    device: tv
    present:
      name: TV connected
  - platform: hdmi_cec_rmt
    device: apple_tv
    present:
      name: Apple TV connected
  - platform: hdmi_cec_rmt
    device: audio_system
    present:
      name: Audio system connected

text_sensor:
  - platform: hdmi_cec_rmt
    device: apple_tv
    osd_name:
      name: Apple TV CEC name
    physical_address:
      name: Apple TV HDMI address
      entity_category: diagnostic
    vendor_id:
      name: Apple TV vendor
      entity_category: diagnostic
  - platform: hdmi_cec_rmt
    device: audio_system
    osd_name:
      name: Audio system CEC name
    physical_address:
      name: Audio system HDMI address
      entity_category: diagnostic
  # Bus-wide
  - platform: hdmi_cec_rmt
    active_source:
      name: Active source         # OSD name, or "HDMI x.x.x.x" if unknown
    last_message:
      name: CEC last message
      entity_category: diagnostic
      disabled_by_default: true   # Very chatty; enable while debugging

select:
  # Options are the device names below; selecting one switches the TV to it
  # (<Set Stream Path> + <Active Source> fallback). Follows the bus when the
  # active source changes by other means.
  - platform: hdmi_cec_rmt
    name: HDMI source
    devices: [tv, apple_tv]

sensor:
  # Diagnostics for the transport. tx_nack and rx_ack_missed are the numbers
  # that tell us whether the ACK path is working.
  - platform: hdmi_cec_rmt
    frames_received:
      name: CEC frames received
    frames_sent:
      name: CEC frames sent
    tx_nack:
      name: CEC TX not acknowledged
    rx_ack_missed:
      name: CEC ACKs missed
    rx_errors:
      name: CEC RX errors
    acks_sent:
      name: CEC ACKs sent
    tx_arbitration_lost:
      name: CEC TX arbitration lost
    update_interval: 60s
  - platform: wifi_signal
    name: WiFi signal
    update_interval: 60s
  - platform: uptime
    name: Uptime

# -----------------------------------------------------------------------------
# Convenience buttons
# -----------------------------------------------------------------------------
button:
  - platform: template
    name: Scan CEC bus
    entity_category: config
    on_press:
      - hdmi_cec_rmt.scan:

  - platform: template
    name: Everything off
    icon: mdi:power-standby
    on_press:
      - hdmi_cec_rmt.standby:
          destination: 15        # Broadcast

  # Volume via CEC goes to the audio system (address 5). Only does something
  # when an ARC amp/soundbar is on the bus; most TVs ignore volume keys for
  # their own speakers.
  - platform: template
    name: Volume up
    icon: mdi:volume-plus
    on_press:
      - hdmi_cec_rmt.user_control:
          device: audio_system
          key: volume_up
  - platform: template
    name: Volume down
    icon: mdi:volume-minus
    on_press:
      - hdmi_cec_rmt.user_control:
          device: audio_system
          key: volume_down
  - platform: template
    name: Mute
    icon: mdi:volume-mute
    on_press:
      - hdmi_cec_rmt.user_control:
          device: audio_system
          key: mute

  # Remote keys to the Apple TV, wherever it is on the bus
  - platform: template
    name: Apple TV play-pause
    icon: mdi:play-pause
    on_press:
      - hdmi_cec_rmt.user_control:
          device: apple_tv
          key: play              # The Apple TV toggles on play
  - platform: template
    name: Apple TV menu
    icon: mdi:menu
    on_press:
      - hdmi_cec_rmt.user_control:
          device: apple_tv
          key: back
